name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build the deshiqr package
        run: pnpm build

      - name: Verify the browser bundle
        run: node scripts/check-globals.mjs

      - name: Test
        run: pnpm test

  python:
    name: python package (Python ${{ matrix.python-version }})
    # Pin the runner: ubuntu-latest is migrating to 24.04+ images that no longer
    # ship prebuilt Python 3.9, which pyproject.toml still supports (>=3.9).
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Test
        working-directory: python
        run: python -m unittest discover -s tests -v

      - name: Verify packaging
        working-directory: python
        run: |
          python -m pip install --upgrade build
          python -m build --sdist --wheel --outdir dist
