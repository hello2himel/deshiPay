name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build packages, element and web app
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Verify Supabase schema and RLS policies
        run: node scripts/check-sql.mjs

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: deshiqr-web
          path: apps/web/dist
          retention-days: 7
