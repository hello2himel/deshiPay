name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: site tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Site tests
        run: |
          node site/tests/qr.test.js
          node site/tests/export.test.js

      - name: Generated theme CSS is current
        run: |
          node site/scripts/gen-themes.js
          git diff --exit-code site/public/css/themes.css
