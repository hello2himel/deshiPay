name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build for the /deshiQR/ base path
        run: pnpm build
        env:
          DESHIQR_BASE: /deshiQR/

      - name: SPA fallback for deep links
        run: |
          cp apps/web/dist/index.html apps/web/dist/404.html
          touch apps/web/dist/.nojekyll

      - name: Publish the embeddable element bundle (until the npm release)
        run: |
          mkdir -p apps/web/dist/element
          cp packages/element/dist/deshiqr-element.global.js apps/web/dist/element/
          cp packages/element/dist/deshiqr-element.js apps/web/dist/element/
          cp LICENSE apps/web/dist/element/LICENSE
          printf '%s\n' 'deshiQR element bundles (IIFE + ESM). Docs: https://github.com/hello2himel/deshiQR/blob/main/docs/embedding.md' 'IIFE global: DeshiQrElement — <script src="deshiqr-element.global.js"></script>' 'ESM: import "deshiqr-element.js" (self-registers <deshiqr-pay>).' > apps/web/dist/element/README.txt

      - name: Upload the element bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: deshiqr-element
          path: |
            packages/element/dist/deshiqr-element.global.js
            packages/element/dist/deshiqr-element.js
            packages/element/dist/deshiqr-element.d.ts
          retention-days: 14

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
