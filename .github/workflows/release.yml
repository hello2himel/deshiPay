name: Release npm packages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: publish deshiqr, deshiqr-qr, deshiqr-element
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Verify
        run: |
          pnpm typecheck
          pnpm test

      - name: Build libraries
        run: pnpm build:libs

      - name: Publish
        run: |
          pnpm --filter deshiqr publish --access public --provenance --no-git-checks
          pnpm --filter deshiqr-qr publish --access public --provenance --no-git-checks
          pnpm --filter deshiqr-element publish --access public --provenance --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
