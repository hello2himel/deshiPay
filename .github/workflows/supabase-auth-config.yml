name: Supabase auth config

# The Supabase GitHub integration applies database migrations from
# supabase/migrations/ automatically, but it does not push auth settings or
# email templates from supabase/config.toml. This job does that with the CLI:
#   - auth email confirmations / OTP length + expiry
#   - the branded templates in supabase/templates/
#   - auth URLs and other declared auth settings
#
# One-time setup: create a Supabase personal access token and add it as the
# repository secret SUPABASE_ACCESS_TOKEN. Until then this job is a no-op.

on:
  push:
    branches: [main]
    paths:
      - supabase/config.toml
      - supabase/templates/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  push-config:
    name: push auth config + email templates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Push supabase/config.toml to the production project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: wbnkjhlaitoetaztukiy
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN is not set; skipping."
            echo "Add it under Settings → Secrets and variables → Actions to enable automatic config push."
            exit 0
          fi
          supabase config push --project-ref "$SUPABASE_PROJECT_ID" --yes

      - name: Inspect the effective auth settings (no secrets)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: wbnkjhlaitoetaztukiy
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then exit 0; fi
          curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/config/auth" -o /tmp/auth.json
          echo "Auth config keys:"
          jq -r 'keys[]' /tmp/auth.json | sort | tr '\n' ' '; echo
          echo "Selected settings:"
          jq '{
            site_url, uri_allow_list, external_email_enabled, disable_signup,
            mailer_autoconfirm, mailer_secure_email_change_enabled,
            mailer_otp_length, mailer_otp_exp, password_min_length,
            rate_limit_email_sent, smtp_host, smtp_port, smtp_admin_email, smtp_sender_name,
            mailer_templates_confirmation_subject,
            mailer_templates_recovery_subject,
            mailer_templates_magic_link_subject,
            mailer_templates_email_change_subject,
            mailer_templates_invite_subject,
            mailer_templates_reauthentication_subject
          }' /tmp/auth.json
