name: Supabase auth config

# The Supabase GitHub integration applies database migrations from
# supabase/migrations/ automatically, but it does not push auth settings or
# email templates from supabase/config.toml. This job does that with the CLI:
#   - auth email confirmations / OTP length + expiry
#   - the branded templates in supabase/templates/
#   - auth URLs and other declared auth settings
#
# One-time setup: create a Supabase personal access token and add it as the
# repository secret SUPABASE_ACCESS_TOKEN. Until then this job is a no-op.

on:
  push:
    branches: [main]
    paths:
      - supabase/config.toml
      - supabase/templates/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  push-config:
    name: push auth config + email templates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Push supabase/config.toml to the production project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: wbnkjhlaitoetaztukiy
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN is not set; skipping."
            echo "Add it under Settings → Secrets and variables → Actions to enable automatic config push."
            exit 0
          fi
          supabase config push --project-ref "$SUPABASE_PROJECT_ID" --yes

      - name: Tighten password policy and apply the reauthentication template
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: wbnkjhlaitoetaztukiy
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then exit 0; fi
          # Not expressible in config.toml (CLI supports five mailer templates,
          # not reauthentication; no password-policy fields), so patch the auth
          # config through the Management API. Only these fields are sent.
          jq -n \
            --arg subject "Your DeshiPay verification code" \
            --rawfile content supabase/templates/reauthentication.html \
            '{
              password_min_length: 8,
              mailer_subjects_reauthentication: $subject,
              mailer_templates_reauthentication_content: $content
            }' > /tmp/auth-patch.json
          code=$(curl -sS -o /tmp/auth-patch-response.json -w '%{http_code}' \
            -X PATCH \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data @/tmp/auth-patch.json \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/config/auth")
          echo "auth config PATCH: HTTP $code"
          jq '{password_min_length, mailer_subjects_reauthentication}' /tmp/auth-patch-response.json
          test "$code" -ge 200 -a "$code" -lt 300

      - name: Check applied database migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: wbnkjhlaitoetaztukiy
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then exit 0; fi
          curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/database/migrations" \
            -o /tmp/migrations.json
          echo "Applied migrations (latest 8):"
          jq -r 'sort_by(.version) | .[-8:][] | .version' /tmp/migrations.json

      - name: Inspect the effective auth settings (no secrets)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: wbnkjhlaitoetaztukiy
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then exit 0; fi
          curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/config/auth" -o /tmp/auth.json
          echo "Auth config keys:"
          jq -r 'keys[]' /tmp/auth.json | sort | tr '\n' ' '; echo
          echo "Selected settings:"
          jq '{
            site_url, uri_allow_list, external_email_enabled, disable_signup,
            mailer_autoconfirm, mailer_secure_email_change_enabled,
            mailer_otp_length, mailer_otp_exp, password_min_length,
            password_hibp_enabled, security_update_password_require_current_password,
            security_update_password_require_reauthentication,
            refresh_token_rotation_enabled, mailer_allow_unverified_email_sign_ins,
            rate_limit_email_sent, rate_limit_sign_in_sign_ups, rate_limit_token_verifications,
            smtp_host, smtp_port, smtp_admin_email, smtp_sender_name,
            smtp_user_present: (.smtp_user != null and .smtp_user != ""),
            subjects: {
              confirmation: .mailer_subjects_confirmation,
              recovery: .mailer_subjects_recovery,
              magic_link: .mailer_subjects_magic_link,
              email_change: .mailer_subjects_email_change,
              invite: .mailer_subjects_invite,
              reauthentication: .mailer_subjects_reauthentication
            },
            template_chars: {
              confirmation: (.mailer_templates_confirmation_content | length),
              recovery: (.mailer_templates_recovery_content | length),
              magic_link: (.mailer_templates_magic_link_content | length),
              email_change: (.mailer_templates_email_change_content | length),
              invite: (.mailer_templates_invite_content | length),
              reauthentication: (.mailer_templates_reauthentication_content | length)
            }
          }' /tmp/auth.json
