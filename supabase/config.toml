# Supabase project configuration for the DeshiQR website.
#
#   schema    -> supabase/migrations/*.sql  (applied by the Supabase GitHub integration)
#   auth/API  -> sections below             (applied to the production project through the
#                                            integration's [remotes.production] block)
#
# One-time setup in the Supabase dashboard:
#   Project Settings > Integrations > GitHub > authorize hello2himel/deshiQR,
#   Working directory ".", enable "Deploy to production".
# From then on, a push/merge to main applies pending migrations and this config.
project_id = "deshiqr"

[db.migrations]
enabled = true

# ---------------------------------------------------------------------------
# Local development defaults (`supabase start`, `supabase db push`).
# ---------------------------------------------------------------------------
[auth]
enabled = true
site_url = "http://localhost:8888"
additional_redirect_urls = ["http://localhost:8888/app"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
# Turn confirmations on once custom SMTP is configured; until then sign-up goes
# straight to the dashboard instead of depending on the rate-limited built-in mailer.
enable_confirmations = false
double_confirm_changes = true

# ---------------------------------------------------------------------------
# Production project (wbnkjhlaitoetaztukiy). These keys override the defaults
# above for the production branch when the GitHub integration deploys it.
# The block name is arbitrary; project_id must be the production project ref.
# ---------------------------------------------------------------------------
[remotes.production]
project_id = "wbnkjhlaitoetaztukiy"

[remotes.production.auth]
enabled = true
site_url = "https://deshipay.netlify.app"
additional_redirect_urls = [
  "https://deshipay.netlify.app/app",
  "http://localhost:8888/app"
]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false

[remotes.production.auth.email]
enable_signup = true
enable_confirmations = false
double_confirm_changes = true
