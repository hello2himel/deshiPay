# Supabase project configuration for the DeshiQR website.
#
#   schema    -> supabase/migrations/*.sql  (applied by the Supabase GitHub integration)
#   auth/API  -> sections below             (applied to the production project through the
#                                            integration's [remotes.production] block)
#
# One-time setup in the Supabase dashboard:
#   Project Settings > Integrations > GitHub > authorize hello2himel/deshiQR,
#   Working directory ".", enable "Deploy to production".
# From then on, a push/merge to main applies pending migrations and this config.
project_id = "deshiqr"

[db.migrations]
enabled = true

# ---------------------------------------------------------------------------
# Local development defaults (`supabase start`, `supabase db push`).
# ---------------------------------------------------------------------------
[auth]
enabled = true
site_url = "http://localhost:8888"
additional_redirect_urls = ["http://localhost:8888/app"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
# Email + password sign-up is verified with a 6-digit code from the custom
# template below; password resets use a code too.
enable_confirmations = true
double_confirm_changes = true
otp_length = 6
otp_expiry = 600

[auth.email.template.confirmation]
subject = "Your DeshiPay confirmation code"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your DeshiPay password"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.magic_link]
subject = "Your DeshiPay sign-in code"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.email_change]
subject = "Confirm your new DeshiPay email"
content_path = "./supabase/templates/email_change.html"

[auth.email.template.invite]
subject = "You’re invited to DeshiPay"
content_path = "./supabase/templates/invite.html"

# ---------------------------------------------------------------------------
# Production project (wbnkjhlaitoetaztukiy). These keys override the defaults
# above for the production branch when the GitHub integration deploys it.
# The block name is arbitrary; project_id must be the production project ref.
# ---------------------------------------------------------------------------
[remotes.production]
project_id = "wbnkjhlaitoetaztukiy"

[remotes.production.auth]
enabled = true
site_url = "https://deshipay.netlify.app"
additional_redirect_urls = [
  "https://deshipay.netlify.app/app",
  "http://localhost:8888/app"
]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false

[remotes.production.auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
otp_length = 6
otp_expiry = 600

[remotes.production.auth.email.template.confirmation]
subject = "Your DeshiPay confirmation code"
content_path = "./supabase/templates/confirmation.html"

[remotes.production.auth.email.template.recovery]
subject = "Reset your DeshiPay password"
content_path = "./supabase/templates/recovery.html"

[remotes.production.auth.email.template.magic_link]
subject = "Your DeshiPay sign-in code"
content_path = "./supabase/templates/magic_link.html"

[remotes.production.auth.email.template.email_change]
subject = "Confirm your new DeshiPay email"
content_path = "./supabase/templates/email_change.html"

[remotes.production.auth.email.template.invite]
subject = "You’re invited to DeshiPay"
content_path = "./supabase/templates/invite.html"
